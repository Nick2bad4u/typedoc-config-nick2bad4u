name: "Continuous Integration"

run-name: "Continuous Integration • ${{ github.ref_name }} @${{ github.actor }}"

concurrency:
    group: "ci-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

on:
    push:
        branches:
            - "main"
    pull_request:
    merge_group:
        types:
            - "checks_requested"

jobs:
    test:
        name: "Test (${{ matrix.label }})"
        runs-on: "${{ matrix.os }}"
        timeout-minutes: 60
        permissions:
            contents: "read"
        strategy:
            fail-fast: true
            matrix:
                include:
                    - label: "linux"
                      os: "ubuntu-latest"
                      codecov_flag: "os-linux"
                    - label: "windows"
                      os: "windows-latest"
                      codecov_flag: "os-windows"
                    - label: "macos"
                      os: "macos-latest"
                      codecov_flag: "os-macos"
        defaults:
            run:
                shell: "bash"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              if: "${{ matrix.os == 'ubuntu-latest' }}"
              uses: "step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c" # v2.21.0
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Setup Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false

            - name: "Install pinned npm"
              run: |
                  set -euo pipefail
                  npm_version=$(node -p "require('./package.json').packageManager.split('@').at(-1)")
                  npm install --global --ignore-scripts npm@12.0.2
                  test "$(npm --version)" = "$npm_version"

            - name: "Install dependencies without lifecycle scripts"
              run: "npm ci --ignore-scripts"

            - name: "Run approved dependency lifecycle scripts"
              run: "npm rebuild"

            - name: "Build package"
              run: "npm run build"

            - name: "Typecheck"
              run: "npm run typecheck"

            - name: "Run tests with coverage and JUnit report"
              run: "npm run coverage:ci"
              env:
                  CI: "true"
                  MAX_THREADS: "1"
                  VITEST_HANGING_PROCESS_REPORTER: "true"

            - name: "Verify coverage artifact"
              run: >-
                  python -c "from pathlib import Path; assert Path('coverage/lcov.info').is_file(), 'coverage/lcov.info was not generated'"

            - name: "Verify JUnit artifact"
              run: >-
                  python -c "from pathlib import Path; assert Path('test-report.junit.xml').is_file(), 'test-report.junit.xml was not generated'"

            - name: "Upload test results to Codecov"
              if: "${{ !cancelled() && env.CODECOV_TOKEN != '' }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              env:
                  CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"
              with:
                  token: "${{ env.CODECOV_TOKEN }}"
                  slug: "Nick2bad4u/typedoc-config-nick2bad4u"
                  files: "test-report.junit.xml"
                  flags: "${{ matrix.codecov_flag }}"
                  name: "vitest-junit-${{ matrix.codecov_flag }}"
                  report_type: "test_results"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

            - name: "Upload coverage to Codecov"
              if: "${{ !cancelled() && env.CODECOV_TOKEN != '' }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              env:
                  CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"
              with:
                  token: "${{ env.CODECOV_TOKEN }}"
                  slug: "Nick2bad4u/typedoc-config-nick2bad4u"
                  files: "./coverage/lcov.info"
                  flags: "${{ matrix.codecov_flag }}"
                  name: "vitest-unit-coverage-${{ matrix.codecov_flag }}"
                  report_type: "coverage"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

    verify:
        name: "Verify pipeline"
        runs-on: "ubuntu-latest"
        timeout-minutes: 60
        permissions:
            contents: "read"
        defaults:
            run:
                shell: "bash"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              uses: "step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c" # v2.21.0
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Setup Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false

            - name: "Install pinned npm"
              run: |
                  set -euo pipefail
                  npm_version=$(node -p "require('./package.json').packageManager.split('@').at(-1)")
                  npm install --global --ignore-scripts npm@12.0.2
                  test "$(npm --version)" = "$npm_version"

            - name: "Install native lint tools"
              run: |
                  set -euo pipefail
                  go install github.com/zricethezav/gitleaks/v8@83d9cd684c87d95d656c1458ef04895a7f1cbd8e
                  echo "${HOME}/go/bin" >> "${GITHUB_PATH}"
                  python -m pip install --user --disable-pip-version-check yamllint==1.38.0
                  echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

            - name: "Install dependencies without lifecycle scripts"
              run: "npm ci --ignore-scripts"

            - name: "Run approved dependency lifecycle scripts"
              run: "npm rebuild"

            - name: "Run full verification pipeline"
              run: "npm run release:verify"
